<!doctype html>
<html lang="id">
<head>
<title>Kuis Kita</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: satu kolom sempit (maks 640px), tombol tebal dengan bayangan keras, dibuat untuk dipakai di hp. */
:root {
  --bg: #ECEFF5;
  --surface: #FFFFFF;
  --soft: #E1E6F0;
  --ink: #141824;
  --muted: #566078;
  --line: #141824;
  --accent: #2E44E6;
  --on-accent: #FFFFFF;
  --good: #17805A;
  --good-bg: #DDF3E9;
  --bad: #C93A3A;
  --bad-bg: #FBE3E1;
  --mark: #FFD84A;
  --ca: var(--accent); --on-ca: var(--on-accent);
  --cb: #FFD84A; --on-cb: #141824;
  --cc: #34D399; --on-cc: #0B2A1F;
  --cd: #FF7A7A; --on-cd: #2A0B0B;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
.feedback.no { border-color: var(--bad); background: var(--bad-bg); }
.score { font-family: var(--font-display); font-weight: 800; font-size: clamp(4rem, 22vw, 6.5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 0.4em; color: var(--muted); }
.review { display: flex; flex-direction: column; gap: 10px; }
.review > div { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 0.9rem; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 10; }
#toast.on { opacity: 1; transform: translateX(-50%); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-10px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.45) rotate(-6deg); } 100% { transform: scale(1); } }
@keyframes spin-in { from { transform: rotate(-200deg) scale(0.3); opacity: 0; } to { transform: rotate(12deg) scale(1); opacity: 1; } }
.anim > * { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
.anim > *:nth-child(2) { animation-delay: 0.06s; }
.anim > *:nth-child(3) { animation-delay: 0.12s; }
.anim > *:nth-child(4) { animation-delay: 0.18s; }
.anim > *:nth-child(5) { animation-delay: 0.24s; }
.anim > *:nth-child(6) { animation-delay: 0.3s; }
.anim .opt { animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
.anim .opt:nth-child(1) { animation-delay: 0.14s; }
.anim .opt:nth-child(2) { animation-delay: 0.22s; }
.anim .opt:nth-child(3) { animation-delay: 0.3s; }
.anim .opt:nth-child(4) { animation-delay: 0.38s; }
.anim .qcard:last-of-type { animation-delay: 0.1s; }
.opt.correct { animation: pop 0.45s ease; }
.opt.wrong { animation: shake 0.45s ease; }
.feedback { animation: drop 0.3s ease backwards; }
.shake { animation: shake 0.4s ease; }
.brand::before { animation: spin-in 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) backwards; }
.streak { display: inline-block; margin-left: 8px; padding: 0 9px; background: var(--mark); color: #141824; border: 2px solid var(--line); border-radius: 99px; font-weight: 800; }
.streak.bump { animation: bump 0.5s ease; }
.score { transform-origin: left bottom; }
.anim .score { animation: pop 0.8s 0.2s ease backwards; }
.sub { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (hover: hover) {
  .btn:hover:not(.ghost), .opt:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 0 var(--line); }
  .btn.ghost:hover { color: var(--accent); }
}
.btn:not(.ghost):active, .opt:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn, .opt { transition: transform 0.12s, box-shadow 0.12s; }
.stickers { display: flex; gap: 10px; }
.stickers i { font-style: normal; width: 54px; height: 54px; border: 2px solid var(--line); border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; box-shadow: 0 4px 0 var(--line); animation: float 3.2s ease-in-out infinite; }
.stickers i:nth-child(1) { background: var(--ca); color: var(--on-ca); rotate: -8deg; }
.stickers i:nth-child(2) { background: var(--cb); color: var(--on-cb); rotate: 6deg; animation-delay: -0.8s; }
.stickers i:nth-child(3) { background: var(--cc); color: var(--on-cc); rotate: -4deg; animation-delay: -1.6s; }
.stickers i:nth-child(4) { background: var(--cd); color: var(--on-cd); rotate: 9deg; animation-delay: -2.4s; }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -9px; } }
body { background-image: radial-gradient(var(--soft) 1.4px, transparent 1.4px); background-size: 24px 24px; }
.panel.make { --line: #141824; --ink: #141824; --muted: #4A4630; --surface: #FFFFFF; background: var(--mark); color: #141824; }
.hero.result { background: var(--accent); color: var(--on-accent); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--line); padding: 24px 20px; }
.hero.result .label, .hero.result .sub { color: inherit; opacity: 0.85; }
.opt[data-k="0"] .k { background: var(--ca); color: var(--on-ca); }
.opt[data-k="1"] .k { background: var(--cb); color: var(--on-cb); }
.opt[data-k="2"] .k { background: var(--cc); color: var(--on-cc); }
.opt[data-k="3"] .k { background: var(--cd); color: var(--on-cd); }
.opt.correct[data-k] .k { background: var(--good); color: var(--bg); }
.opt.wrong[data-k] .k { background: var(--bad); color: var(--bg); }
#app[data-v="build"], #app[data-v="share"], #app[data-v="play"] { max-width: 720px; }
@media (min-width: 720px) {
  #app { padding-block: 32px 56px; gap: 24px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt { min-height: 72px; font-size: 1.05rem; }
  .question { font-size: 2rem; }
}
@media (min-width: 880px) {
  #app[data-v="home"] { max-width: 1040px; display: grid; grid-template-columns: 1.15fr 1fr; column-gap: 48px; row-gap: 22px; align-items: start; padding-block: 40px 64px; }
  #app[data-v="home"] .top { grid-column: 1 / -1; }
  #app[data-v="home"] .hero { grid-column: 1; grid-row: 2 / span 2; align-self: center; gap: 20px; }
  #app[data-v="home"] .hero h1 { font-size: 3.7rem; }
  #app[data-v="home"] .hero p { font-size: 1.15rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var LET = ['A', 'B', 'C', 'D'];
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  /* ---------- data ---------- */
  function sample() {
    return {
      t: 'Seberapa kenal kamu sama aku?', a: '',
      q: [
        { q: 'Makanan favoritku apa?', o: ['Nasi goreng', 'Bakso', 'Mie ayam', 'Sate'], c: 0 },
        { q: 'Aku lebih suka hujan atau panas?', o: ['Hujan', 'Panas'], c: 0 }
      ]
    };
  }
  function clean(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.q) || !o.q.length || o.q.length > 50) return null;
    var q = [];
    for (var i = 0; i < o.q.length; i++) {
      var x = o.q[i];
      if (!x || typeof x.q !== 'string' || !Array.isArray(x.o) || x.o.length < 2 || x.o.length > 4) return null;
      var opts = x.o.map(function (v) { return String(v).slice(0, 200); });
      var c = (Number.isInteger(x.c) && x.c >= 0 && x.c < opts.length) ? x.c : 0;
      q.push({ q: x.q.slice(0, 400), o: opts, c: c });
    }
    return { t: String(o.t || 'Quiz tanpa judul').slice(0, 100), a: String(o.a || '').slice(0, 40), q: q };
  }
  var hasSaved = false;
  function loadDraft() {
    try {
      var raw = localStorage.getItem('kuiskita_draft');
      if (raw) { var d = clean(JSON.parse(raw)); if (d) { hasSaved = true; return d; } }
    } catch (e) {}
    return sample();
  }
  function saveDraft() { try { localStorage.setItem('kuiskita_draft', JSON.stringify(state.draft)); hasSaved = true; } catch (e) {} }

  var state = { view: 'home', draft: loadDraft(), errs: [], joinErr: '', code: '', play: null };

  /* ---------- skor ---------- */
  function hashStr(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

  /* ---------- kode quiz ---------- */
  function b64(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    var bin = atob(str), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  async function enc(obj) {
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    try {
      if (typeof CompressionStream !== 'undefined') {
        var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        var buf = new Uint8Array(await new Response(stream).arrayBuffer());
        return 'Q1' + b64(buf);
      }
    } catch (e) {}
    return 'Q0' + b64(bytes);
  }
  async function dec(text) {
    var m = String(text).match(/Q[01][A-Za-z0-9_-]{8,}/);
    if (!m) return null;
    try {
      var code = m[0], u8 = unb64(code.slice(2));
      if (code[1] === '1') {
        var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        u8 = new Uint8Array(await new Response(stream).arrayBuffer());
      }
      return clean(JSON.parse(new TextDecoder().decode(u8)));
    } catch (e) { return null; }
  }

  /* ---------- util ---------- */
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }
  async function copyText(text, el) {
    try { await navigator.clipboard.writeText(text); toast('Tersalin'); }
    catch (e) { if (el) { el.focus(); el.select(); } toast('Tahan lalu salin manual'); }
  }
  function go(view) { state.view = view; state.anim = true; render(); window.scrollTo(0, 0); }

  /* ---------- views ---------- */
  function vHome() {
    return '<div class="top"><span class="brand">Kuis Kita</span></div>' +
      '<section class="hero"><div class="stickers" aria-hidden="true"><i>A</i><i>B</i><i>C</i><i>D</i></div>' +
      '<h1>Bikin quiz sendiri, <span class="hl">kirim ke temen</span>.</h1>' +
      '<p>Tulis soalnya, ambil kodenya, kirim. Temen ngerjain dari hp atau laptop kapan aja, nilainya langsung keluar.</p></section>' +
      '<section class="panel make"><h2>Bikin quiz</h2>' +
      '<p class="muted">Pilihan ganda, 2 sampai 4 pilihan per soal. Draf kamu tersimpan di perangkat ini.</p>' +
      '<button class="btn primary" data-act="build">' + (hasSaved ? 'Lanjut edit quiz' : 'Mulai bikin') + '</button></section>' +
      '<section class="panel"><h2>Kerjain quiz temen</h2>' +
      '<div class="field"><label for="joincode">Kode quiz</label>' +
      '<textarea id="joincode" class="code" placeholder="Tempel kode atau seluruh pesan dari temen di sini"></textarea></div>' +
      (state.joinErr ? '<p class="err">' + esc(state.joinErr) + '</p>' : '') +
      '<button class="btn" data-act="join">Mulai ngerjain</button></section>';
  }

  function vBuild() {
    var d = state.draft;
    var h = '<div class="top"><button class="btn ghost" data-act="home">&larr; Beranda</button><span class="brand">Bikin quiz</span></div>';
    h += '<section class="panel"><div class="field"><label for="f-t">Judul quiz</label>' +
      '<input type="text" id="f-t" data-f="t" maxlength="100" value="' + esc(d.t) + '"></div>' +
      '<div class="field"><label for="f-a">Nama kamu (wajib)</label>' +
      '<input type="text" id="f-a" data-f="a" maxlength="40" placeholder="Biar temen tahu ini quiz dari siapa" value="' + esc(d.a) + '"></div></section>';
    d.q.forEach(function (q, qi) {
      h += '<section class="qcard"><div class="qhead"><h3>Soal ' + (qi + 1) + '</h3>' +
        (d.q.length > 1 ? '<button class="btn small danger" data-act="delq" data-qi="' + qi + '">Hapus</button>' : '') + '</div>' +
        '<div class="field"><label for="q-' + qi + '">Pertanyaan</label>' +
        '<textarea id="q-' + qi + '" data-f="q" data-qi="' + qi + '" maxlength="400">' + esc(q.q) + '</textarea></div>' +
        '<div class="label">Pilihan, lalu tandai jawaban yang benar</div>';
      q.o.forEach(function (o, oi) {
        h += '<div class="opt-edit"><input type="radio" name="c-' + qi + '" id="c-' + qi + '-' + oi + '" data-act="correct" data-qi="' + qi + '" data-oi="' + oi + '"' + (q.c === oi ? ' checked' : '') + ' aria-label="Jawaban benar: pilihan ' + LET[oi] + '">' +
          '<input type="text" id="o-' + qi + '-' + oi + '" data-f="o" data-qi="' + qi + '" data-oi="' + oi + '" maxlength="200" placeholder="Pilihan ' + LET[oi] + '" value="' + esc(o) + '">' +
          (q.o.length > 2 ? '<button class="btn small danger" data-act="delo" data-qi="' + qi + '" data-oi="' + oi + '" aria-label="Hapus pilihan ' + LET[oi] + '">&times;</button>' : '') + '</div>';
      });
      if (q.o.length < 4) h += '<button class="btn small" data-act="addo" data-qi="' + qi + '">+ Tambah pilihan</button>';
      h += '</section>';
    });
    if (state.errs.length) h += '<div class="err">Belum bisa dibuat:<ul>' + state.errs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
    h += '<div class="bar"><button class="btn" data-act="addq">+ Tambah soal</button><button class="btn primary" data-act="make">Buat kode quiz</button></div>';
    return h;
  }

  function vShare() {
    var d = state.draft, n = d.q.length;
    var msg = 'Kerjain quiz aku "' + d.t + '" (' + n + ' soal). Buka Kuis Kita, pilih "Kerjain quiz temen", lalu tempel kode ini:\n\n' + state.code;
    return '<div class="top"><button class="btn ghost" data-act="build">&larr; Edit lagi</button><span class="brand">Quiz siap</span></div>' +
      '<section class="hero"><h1>"' + esc(d.t) + '" udah jadi.</h1><p>' + n + ' soal. Kirim link halaman ini ke temen, lalu kirim kode di bawah.</p></section>' +
      '<section class="panel"><div class="field"><label for="sharecode">Kode quiz</label>' +
      '<textarea id="sharecode" class="code" readonly>' + esc(state.code) + '</textarea></div>' +
      '<div class="row"><button class="btn primary" data-act="copycode" style="flex:1 1 140px">Salin kode</button>' +
      '<a class="btn" style="flex:1 1 140px" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Kirim lewat WhatsApp</a></div></section>' +
      '<section class="panel"><h3>Cara temen ngerjain</h3><ol class="steps"><li>Buka link halaman ini di hp atau laptop.</li><li>Tempel kode di kotak "Kerjain quiz temen".</li><li>Jawab semua soal, nilai langsung muncul.</li></ol></section>' +
      '<button class="btn" data-act="trydraft">Coba quiz-nya dulu</button>';
  }

  function vPlay() {
    var p = state.play, qz = p.quiz, n = qz.q.length;
    if (p.stage === 'intro') {
      return '<div class="top"><button class="btn ghost" data-act="home">&larr; Beranda</button><span class="brand">Kuis Kita</span></div>' +
        '<section class="hero"><h1>' + esc(qz.t) + '</h1><p>' + n + ' soal' + (qz.a ? ', dibuat oleh ' + esc(qz.a) : '') + '. Pilih satu jawaban per soal.</p></section>' +
        '<section class="panel"><div class="field' + (p.nameErr ? ' shake' : '') + '"><label for="pname">Nama kamu (wajib)</label><input type="text" id="pname" maxlength="40" placeholder="Tulis namamu dulu" value="' + esc(p.name) + '"></div>' +
        (p.nameErr ? '<p class="err">Isi namamu dulu ya, biar hasilnya ada namanya.</p>' : '') +
        '<button class="btn primary" data-act="start">Mulai</button></section>';
    }
    if (p.stage === 'q') {
      var q = qz.q[p.i], answered = p.sel !== null;
      var to = p.i / n * 100, from = p.prevPct || 0;
      p.prevPct = to;
      var h = '<div class="meta"><span>Soal ' + (p.i + 1) + ' dari ' + n + '</span><span>Benar: ' + p.score +
        (p.streak >= 2 ? '<b class="streak' + (answered ? ' bump' : '') + '">x' + p.streak + ' beruntun</b>' : '') + '</span></div>' +
        '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + p.i + '"><i style="width:' + from + '%" data-to="' + to + '"></i></div>' +
        '<h2 class="question">' + esc(q.q) + '</h2><div class="opts">';
      q.o.forEach(function (o, oi) {
        var cls = 'opt';
        if (answered) { if (oi === q.c) cls += ' correct'; else if (oi === p.sel) cls += ' wrong'; else cls += ' dim'; }
        h += '<button class="' + cls + '" data-k="' + oi + '" data-act="pick" data-oi="' + oi + '"' + (answered ? ' disabled' : '') + '><span class="k">' + LET[oi] + '</span><span>' + esc(o) + '</span></button>';
      });
      h += '</div>';
      if (answered) {
        var ok = p.sel === q.c;
        h += '<div class="feedback ' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Benar!' : 'Kurang tepat. Jawabannya: ' + esc(q.o[q.c])) + '</div>' +
          '<button class="btn primary" data-act="next">' + (p.i + 1 >= n ? 'Lihat nilai' : 'Lanjut') + '</button>';
      }
      return h;
    }
    var pct = p.score / n, note = pct === 1 ? 'Sempurna' : pct >= 0.7 ? 'Mantap' : pct >= 0.4 ? 'Lumayan' : 'Masih bisa naik';
    var wrong = [], pn = p.name.trim();
    qz.q.forEach(function (q, i) { if (p.answers[i] !== q.c) wrong.push(i); });
    var secs = Math.round(p.totalSec), nilai = Math.round(p.score / n * 100);
    var share = pn + ' dapat ' + p.score + '/' + n + ' benar (nilai ' + nilai + ') di quiz "' + qz.t + '"' + (qz.a ? ' buatan ' + qz.a : '') + '. Coba juga!';
    var h2 = '<div class="top"><span class="brand">Hasil</span></div>' +
      '<section class="hero result"><p class="label">' + esc(qz.t) + '</p><div class="score"><span id="sc">' + p.score + '</span><small>/' + n + '</small></div>' +
      '<p class="sub">Nilai ' + nilai + ', ' + (n - p.score) + ' salah, ' + secs + ' detik</p><h2>' + note + ', ' + esc(pn) + '.</h2></section>';
    if (wrong.length) {
      h2 += '<section class="review"><h3>Yang masih salah</h3>' + wrong.map(function (i) {
        var q = qz.q[i];
        return '<div><strong>' + esc(q.q) + '</strong><span class="muted">Jawabanmu: ' + esc(q.o[p.answers[i]]) + '</span><span style="color:var(--good);font-weight:700">Yang benar: ' + esc(q.o[q.c]) + '</span></div>';
      }).join('') + '</section>';
    }
    h2 += '<section class="panel"><h3>Kasih tahu temen</h3><div class="field"><label for="rtext">Hasilmu</label><textarea id="rtext" readonly style="min-height:72px">' + esc(share) + '</textarea></div>' +
      '<div class="row"><button class="btn primary" style="flex:1 1 140px" data-act="copyresult">Salin hasil</button>' +
      '<a class="btn" style="flex:1 1 140px" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(share) + '">Kirim lewat WhatsApp</a></div></section>' +
      '<div class="row"><button class="btn primary" style="flex:1 1 140px" data-act="again">Ulangi</button><button class="btn" style="flex:1 1 140px" data-act="home">Beranda</button></div>';
    return h2;
  }

  function reduced() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

  function countUp(el, to) {
    if (reduced() || !to) return;
    el.textContent = '0';
    var t0 = performance.now(), dur = 900;
    (function step(t) {
      var k = Math.min(1, (t - t0) / dur);
      k = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(to * k);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  }

  function confetti(x, y, count, power) {
    if (reduced()) return;
    var cv = document.getElementById('fx');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
    var cols = ['#FFD84A', '#2E44E6', '#17B26A', '#FF5C5C', '#8593FF'], ps = [];
    for (var i = 0; i < count; i++) {
      ps.push({ x: x + (Math.random() - 0.5) * 40, y: y, vx: (Math.random() - 0.5) * power, vy: -Math.random() * power - power * 0.3,
        s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] });
    }
    var t0 = performance.now();
    (function f(t) {
      ctx.clearRect(0, 0, W, H);
      var alive = false;
      ps.forEach(function (p) {
        p.vy += 0.38; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr;
        if (p.y < H + 20) alive = true;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6); ctx.restore();
      });
      if (alive && t - t0 < 4000) requestAnimationFrame(f); else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  function afterRender() {
    var bar = app.querySelector('.progress i');
    if (bar) {
      var to = bar.getAttribute('data-to');
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = to + '%'; }); });
    }
    var p = state.play;
    if (state.view === 'play' && p && p.stage === 'done' && state.anim === false && app.querySelector('#sc')) {
      if (!p.celebrated) {
        p.celebrated = true;
        countUp(document.getElementById('sc'), p.score);
        if (p.score / p.quiz.q.length >= 0.7) confetti(window.innerWidth / 2, window.innerHeight * 0.35, 140, 15);
      }
    }
  }

  function render() {
    app.className = state.anim ? 'anim' : '';
    app.setAttribute('data-v', state.view);
    state.anim = false;
    app.innerHTML = state.view === 'home' ? vHome() : state.view === 'build' ? vBuild() : state.view === 'share' ? vShare() : vPlay();
    afterRender();
  }

  /* ---------- aksi ---------- */
  function startPlay(quiz) {
    state.play = { quiz: quiz, name: '', nameErr: false, stage: 'intro', i: 0, sel: null, answers: [], score: 0, streak: 0, prevPct: 0, celebrated: false,
      qid: hashStr(JSON.stringify(quiz)), points: 0, base: 0, bonusSpeed: 0, bonusStreak: 0, totalSec: 0, qStart: 0, last: null };
    go('play');
  }
  function validate() {
    var d = state.draft, e = [];
    if (!d.t.trim()) e.push('Judul quiz masih kosong.');
    if (!d.a.trim()) e.push('Nama kamu masih kosong.');
    d.q.forEach(function (q, i) {
      if (!q.q.trim()) e.push('Soal ' + (i + 1) + ': pertanyaan masih kosong.');
      if (q.o.some(function (o) { return !o.trim(); })) e.push('Soal ' + (i + 1) + ': ada pilihan yang masih kosong.');
    });
    return e;
  }

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'pname' && state.play) { state.play.name = t.value; return; }
    var f = t.getAttribute('data-f');
    if (!f) return;
    var d = state.draft, qi = +t.getAttribute('data-qi'), oi = +t.getAttribute('data-oi');
    if (f === 't' || f === 'a') d[f] = t.value;
    else if (f === 'q') d.q[qi].q = t.value;
    else if (f === 'o') d.q[qi].o[oi] = t.value;
    saveDraft();
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'pname') {
      var s = app.querySelector('[data-act="start"]'); if (s) s.click();
    }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.getAttribute('data-act') === 'correct') {
      state.draft.q[+t.getAttribute('data-qi')].c = +t.getAttribute('data-oi');
      saveDraft();
    }
  });

  app.addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act'), qi = +b.getAttribute('data-qi'), oi = +b.getAttribute('data-oi');
    var d = state.draft, p = state.play;
    if (act === 'home') { state.joinErr = ''; go('home'); }
    else if (act === 'build') { state.errs = []; go('build'); }
    else if (act === 'addq') { d.q.push({ q: '', o: ['', '', '', ''], c: 0 }); saveDraft(); render(); }
    else if (act === 'delq') { d.q.splice(qi, 1); saveDraft(); render(); }
    else if (act === 'addo') { d.q[qi].o.push(''); saveDraft(); render(); }
    else if (act === 'delo') {
      var q = d.q[qi]; q.o.splice(oi, 1);
      if (q.c === oi) q.c = 0; else if (q.c > oi) q.c -= 1;
      saveDraft(); render();
    }
    else if (act === 'make') {
      state.errs = validate();
      if (state.errs.length) { render(); return; }
      state.code = await enc(clean(d));
      go('share');
    }
    else if (act === 'copycode') copyText(state.code, document.getElementById('sharecode'));
    else if (act === 'trydraft') startPlay(clean(d));
    else if (act === 'join') {
      var quiz = await dec(document.getElementById('joincode').value);
      if (!quiz) { state.joinErr = 'Kode tidak terbaca. Salin ulang kode dari temen kamu, lalu tempel lagi.'; render(); return; }
      state.joinErr = ''; startPlay(quiz);
    }
    else if (act === 'start') {
      if (!p.name.trim()) {
        p.nameErr = true; render();
        var inp = document.getElementById('pname'); if (inp) inp.focus();
        return;
      }
      p.nameErr = false; p.stage = 'q'; p.qStart = performance.now(); state.anim = true; render(); window.scrollTo(0, 0);
    }
    else if (act === 'pick') {
      if (p.sel !== null) return;
      var sec = (performance.now() - p.qStart) / 1000;
      p.totalSec += sec;
      p.sel = oi; p.answers[p.i] = oi;
      if (oi === p.quiz.q[p.i].c) {
        p.score++; p.streak++;
        render();
        confetti(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2, p.streak >= 3 ? 60 : 26, 9);
      } else {
        p.streak = 0; render();
        try { if (navigator.vibrate) navigator.vibrate(40); } catch (err) {}
      }
    }
    else if (act === 'next') {
      p.i++; p.sel = null; p.qStart = performance.now();
      if (p.i >= p.quiz.q.length) p.stage = 'done';
      state.anim = true; render(); window.scrollTo(0, 0);
    }
    else if (act === 'again') {
      p.stage = 'q'; p.i = 0; p.sel = null; p.answers = []; p.score = 0; p.streak = 0; p.prevPct = 0; p.celebrated = false;
      p.points = 0; p.base = 0; p.bonusSpeed = 0; p.bonusStreak = 0; p.totalSec = 0; p.last = null; p.qStart = performance.now();
      state.anim = true; render(); window.scrollTo(0, 0);
    }
    else if (act === 'copyresult') copyText(document.getElementById('rtext').value, document.getElementById('rtext'));
  });

  render();
})();
</script>
